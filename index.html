```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Car Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
        }

        .header-content {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .login-btn {
            background: white;
            color: #111827;
            border: none;
            padding: 9px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #6b7280;
        }

        .car-card,
        .stat-card,
        .activity {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .car-card {
            padding: 25px;
            margin-bottom: 25px;
        }

        .car-card h2 {
            margin-bottom: 20px;
        }

        .car-details {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .car-detail {
            color: #6b7280;
        }

        .car-detail strong {
            display: block;
            color: #111827;
            font-size: 20px;
            margin-top: 6px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            padding: 22px;
        }

        .stat-card p {
            color: #6b7280;
            margin-bottom: 8px;
        }

        .stat-card h2 {
            font-size: 25px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary {
            background: #111827;
            color: white;
            border: none;
        }

        .secondary {
            background: white;
            color: #111827;
            border: 1px solid #d1d5db;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .activity {
            padding: 25px;
        }

        .activity h2 {
            margin-bottom: 15px;
        }

        .activity-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .activity-row:last-child {
            border-bottom: none;
        }

        .activity-type {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .activity-info {
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .car-details {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="header-content">

            <div class="logo">
                🚗 My Car Tracker
            </div>

            <button
                class="login-btn"
                onclick="login()">
                Login
            </button>

        </div>

    </header>


    <main>

        <section class="welcome">

            <h1>
                My Dashboard
            </h1>

            <p>
                Track your car, fuel, mileage and service.
            </p>

        </section>


        <section class="car-card">

            <h2>
                My Car
            </h2>

            <div class="car-details">

                <div class="car-detail">

                    Car

                    <strong>
                        Tata Altroz
                    </strong>

                </div>


                <div class="car-detail">

                    Odometer

                    <strong>
                        11000 km
                    </strong>

                </div>


                <div class="car-detail">

                    Fuel Type

                    <strong>
                        Diesel
                    </strong>

                </div>

            </div>

        </section>


        <section class="stats">

            <div class="stat-card">

                <p>
                    Fuel Cost
                </p>

                <h2>
                    ₹3,200
                </h2>

            </div>


            <div class="stat-card">

                <p>
                    Average Mileage
                </p>

                <h2>
                    18.5 km/l
                </h2>

            </div>

        </section>


        <section class="actions">

            <button
                class="btn primary"
                onclick="addFuel()">

                + Add Fuel

            </button>


            <button
                class="btn secondary"
                onclick="addOdometer()">

                + Add Odometer

            </button>

        </section>


        <section class="activity">

            <h2>
                Recent Activity
            </h2>


            <div class="activity-row">

                <div>

                    <div class="activity-type">
                        Fuel
                    </div>

                    <div class="activity-info">
                        35 litres
                    </div>

                </div>

                <strong>
                    ₹3,200
                </strong>

            </div>


            <div class="activity-row">

                <div>

                    <div class="activity-type">
                        Odometer
                    </div>

                    <div class="activity-info">
                        Current reading
                    </div>

                </div>

                <strong>
                    25,000 km
                </strong>

            </div>

        </section>

    </main>


    <script>

        function login() {

            alert("Login page will be added next.");

        }


        function addFuel() {

            alert("Add Fuel page will be added next.");

        }


        function addOdometer() {

            alert("Add Odometer page will be added next.");

        }

    </script>

</body>

</html>
```
